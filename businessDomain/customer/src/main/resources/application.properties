spring.config.import=optional:configserver:http://localhost:8888
#spring.application.name=config-client
#spring.profiles.active=local
spring.application.name=buisnessdomain-client

# Dirección del servidor Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka}

# Registrar Products en Eureka
eureka.client.register-with-eureka=true

# Consultar el registro de servicios de Eureka
eureka.client.fetch-registry=true

eureka.client.healthcheck.enabled=true

# Desactivar Config Server si todavía no lo estás utilizando
spring.cloud.config.enabled=false

# expone todos los endpoints disponibles en el microservicio con actuator
management.endpoints.web.exposure.include=*

server.servlet.context-path=/business

spring.security.user.name=admin
spring.security.user.password=679615
spring.security.user.roles=ADMIN

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/customer
spring.datasource.username=postgres
spring.datasource.password=admin1