spring.application.name=buisnessdomain-client
server.servlet.context-path=/business

# Puerto aleatorio: Eureka registra el que le toque
server.port=0

# Config Server desactivado (quita la línea spring.config.import)
spring.cloud.config.enabled=false

# Eureka: en Docker la variable viene del compose; en local usa localhost
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://admin:admin@localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true

# Imprescindibles con puerto aleatorio y Docker
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

management.endpoints.web.exposure.include=*

spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# Base de datos: en Docker se sustituye por las variables SPRING_DATASOURCE_* del compose
spring.datasource.url=jdbc:postgresql://localhost:5432/customer
spring.datasource.username=postgres
spring.datasource.password=admin1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#acceder al cutator de Spring Boot Admin
eureka.instance.metadata-map.user.name=admin
eureka.instance.metadata-map.user.password=admin