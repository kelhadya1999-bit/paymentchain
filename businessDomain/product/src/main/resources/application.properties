spring.application.name=buisnessdomain-product
server.port=8082

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
spring.h2.console.enabled=true

# Dirección del servidor Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka}

# Registrar Products en Eureka
eureka.client.register-with-eureka=true

# Consultar el registro de servicios de Eureka
eureka.client.fetch-registry=true

eureka.client.healthcheck.enabled=true

# Desactivar Config Server si todavía no lo estás utilizando
spring.cloud.config.enabled=false

# expone todos los endpoints disponibles en el microservicio con actuator
management.endpoints.web.exposure.include=*
