server:
  port: 8090

spring:
  application:
    name: apiGateway
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: customer_service
          uri: lb://buisnessdomain-client
          predicates:
            - Path=/business/**
        - id: product_service
          uri: lb://buisnessdomain-product
          predicates:
            - Path=/Product/**
        - id: transaction_service
          uri: lb://buisnessdomain-transaction
          predicates:
            - Path=/transaction/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://admin:admin@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true