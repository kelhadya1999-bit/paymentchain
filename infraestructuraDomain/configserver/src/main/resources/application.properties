server.port=0
spring.application.name=configServer
server.servlet.context-path=/configServer
server.forward-headers-strategy=framework

#spring.cloud.config.server.git.uri=file:///C:/Users/Khadija/Documents/Cursos%20spring%20boot%20udemy/paymentchainParent/configServerRepo
spring.cloud.config.server.git.uri=file:///config-repo
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=master


spring.security.user.name=admin
spring.security.user.password=admin

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs

spring.h2.console.enabled=true
spring.cloud.config.enabled=false

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://admin:admin@localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

management.endpoints.web.exposure.include=*