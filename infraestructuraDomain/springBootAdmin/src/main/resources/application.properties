spring.application.name=springBootAdmin
server.port=8084

spring.cloud.config.enabled=false
# Dirección del servidor Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka}

# Registrar Products en Eureka
eureka.client.register-with-eureka=true

# Consultar el registro de servicios de Eureka
eureka.client.fetch-registry=true

eureka.client.healthcheck.enabled=true

# expone todos los endpoints disponibles en el microservicio con actuator
management.endpoints.web.exposure.include=*